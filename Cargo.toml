[package]
name = "mega-brain"
version = "0.1.0"
edition = "2021"
description = "Durable multi-agent software engineering control plane"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# SQLite with WAL support
rusqlite = { version = "0.31", features = ["bundled", "wal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI (will be used in Topic 10, but scaffold now)
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
assert_matches = "1"

[profile.release]
opt-level = 3
lto = true
strip = true