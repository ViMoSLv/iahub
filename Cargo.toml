[package]
name = "mega-brain"
version = "0.1.0"
edition = "2021"
description = "Durable multi-agent software engineering control plane"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# SQLite with WAL support
rusqlite = { version = "0.39", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptographic hashing for canonical payload idempotency
sha2 = "0.10"

# CLI (will be used in Topic 10, but scaffold now)
clap = { version = "4", features = ["derive"] }

# PTY / pseudo-terminal (cross-platform: ConPTY on Windows, POSIX PTY on Unix)
portable-pty = "0.8"

# Async trait support for AgentRuntimeAdapter
async-trait = "0.1"

# Futures utilities for output streams
futures = "0.3"

# HTTP/WebSocket server (Phase 1)
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-tungstenite = "0.21"

# OS keychain integration for credential store
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

# Directories for XDG/platform-specific paths
dirs = "5"
git2 = "0.21.0"
notify = "8.2.0"
dashmap = "6.2.1"
ulid = "3.0.0"
serde_yaml = "0.9.34"
regex = "1.13.1"
crc32fast = "1.5.1"

[dev-dependencies]
tempfile = "3"
assert_matches = "1"

[[bin]]
name = "mega-brain-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
